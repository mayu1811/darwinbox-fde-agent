# Render blueprint - https://render.com/docs/blueprint-spec
#
# One Docker web service: FastAPI serves the API, the mock target platform and
# the built React dashboard from a single origin.
#
# Deploy:  New + -> Blueprint -> connect this repo -> Apply
services:
  - type: web
    name: darwinbox-fde-agent
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      # Demo mode: deterministic rules, no API key, no outbound network.
      - key: LLM_PROVIDER
        value: none
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      # Same-origin UI, so no cross-origin allow-list is needed.
      - key: CORS_ORIGINS
        value: ""
      # Slightly faster pacing than local, still watchable.
      - key: AGENT_STEP_DELAY_SECONDS
        value: "0.25"
